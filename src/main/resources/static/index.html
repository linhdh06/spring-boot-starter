<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Demo Home</title>
	<style>
		body {
			margin: 0;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			background: #f5f6f8;
			color: #1f2430;
		}

		main {
			max-width: 48rem;
			margin: 0 auto;
			padding: 3rem 1.5rem;
		}

		h1 {
			margin: 0 0 0.5rem;
			font-size: 1.75rem;
		}

		p {
			margin: 0 0 2rem;
			color: #5b6472;
		}

		ul {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		li {
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			padding: 0.875rem 1rem;
			background: #fff;
			border: 1px solid #e2e5ea;
			border-radius: 0.5rem;
		}

		li + li {
			margin-top: 0.5rem;
		}

		.price {
			font-variant-numeric: tabular-nums;
			color: #5b6472;
		}

		.error {
			color: #b42318;
		}
	</style>
</head>
<body>
<main>
	<h1>Spring Boot Kotlin Demo</h1>
	<p>Static page served on <code>/</code>.</p>

	<h2>Products</h2>
	<ul id="products">
		<li>Loading&hellip;</li>
	</ul>
</main>

<script>
	fetch("/api/v1/products")
		.then((response) => {
			if (!response.ok) {
				throw new Error("HTTP " + response.status);
			}
			return response.json();
		})
		.then((products) => {
			const list = document.getElementById("products");
			if (products.length === 0) {
				list.innerHTML = "<li>No products yet.</li>";
				return;
			}
			list.innerHTML = products
				.map((product) =>
					"<li><span>" + product.name + "</span>" +
					'<span class="price">' + product.price + "</span></li>"
				)
				.join("");
		})
		.catch((error) => {
			document.getElementById("products").innerHTML =
				'<li class="error">Could not load products: ' + error.message + "</li>";
		});
</script>
</body>
</html>
